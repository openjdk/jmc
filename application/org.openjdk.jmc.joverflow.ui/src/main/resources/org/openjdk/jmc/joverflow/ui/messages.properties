DominatorTreeItem_MORE_OBJECTS={0} more objects (only the {1} largest are shown)
DominatorTreeItem_UNREACHABLE_OBJECTS=Objects not reachable from GC roots
DominatorTreePage_CALCULATE=Calculate Dominator Tree
DominatorTreePage_CANCEL=Cancel
DominatorTreePage_DESCRIPTION=The dominator tree shows which objects keep other objects alive. An object dominates another object if every path from the GC roots to the latter passes through the former, and the retained size of an object is the amount of memory that would be freed if the object were garbage collected.\n\nCalculating the dominator tree requires a full scan of the heap dump. Depending on the size of the heap dump this may take a while and use a significant amount of memory.
DominatorTreePage_FAILED_TITLE=Could not calculate the dominator tree
DominatorTreePage_JOB_NAME=Calculating dominator tree for {0}
DominatorTreePage_OUT_OF_MEMORY=There was not enough memory to calculate the dominator tree. Increase the maximum heap size of JDK Mission Control (the -Xmx setting in jmc.ini) and try again.
DominatorTreePage_PHASE_BUILDING_GRAPH=Building reference graph
DominatorTreePage_PHASE_COMPUTING_DOMINATORS=Computing dominators
DominatorTreePage_PHASE_COMPUTING_RETAINED_SIZES=Computing retained sizes
DominatorTreePage_PHASE_SCANNING_HEAP=Scanning heap
DominatorTreePage_PROGRESS={0} ({1}%)
DominatorTreePage_SUMMARY=Total size {0} in {1} objects, of which {2} in {3} objects are not reachable from GC roots.
DominatorTreePage_WAITING_FOR_MODEL=Waiting for the heap dump to finish loading...
DominatorTreePageBookView_NO_JOVERFLOW_EDITOR_SELECTED=No JOverflow editor selected
DominatorTreeViewer_BYTES_TOOLTIP={0} bytes
DominatorTreeViewer_COLUMN_OBJECT=Object
DominatorTreeViewer_COLUMN_RETAINED_PERCENTAGE=Retained %
DominatorTreeViewer_COLUMN_RETAINED_SIZE=Retained Size
DominatorTreeViewer_COLUMN_SHALLOW_SIZE=Shallow Size
TreemapAction_ZOOM_IN_DESCRIPTION=Zoom-in to the selected node
TreemapAction_ZOOM_OUT_DESCRIPTION=Zoom-out to the parent node
TreemapAction_ZOOM_RESET_DESCRIPTION=Reset the zooming level and display the root node
TreemapPageBookView_NO_JOVERFLOW_EDITOR_SELECTED=No JOverflow editor selected
TreemapPage_NO_INSTANCES_SELECTED=No instances selected
